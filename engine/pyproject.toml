[project]
name = "frontroom-engine"
version = "0.1.0"
description = "SynthLeague: a fictional league and a physical match simulator that emits events, 25 Hz tracking and latent truth."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pyarrow>=18",
]

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8.4"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontroom_engine"]
