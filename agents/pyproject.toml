[project]
name = "frontroom-agents"
version = "0.1.0"
description = "Front Room's agents: the Room Director, personal agents and the origins investigation."
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[fastapi]==1.2.2",
    "agent-framework-core==1.21.0",
    "agent-framework-foundry==1.14.1",
    "agent-framework-openai==1.16.0",
    "aiohttp==3.14.5",
    "azure-eventhub==5.15.1",
    "azure-cosmos==4.17.1",
    "azure-ai-evaluation==1.18.8",
    "azure-ai-projects==2.7.0",
    "azure-identity==1.26.0",
    "azure-monitor-opentelemetry-exporter==1.0.0b58",
    "fastapi==0.143.0",
    "mcp==2.3.0",
    "numpy>=2.1",
    "pydantic>=2.11",
    "uvicorn[standard]==0.54.0",
    "websockets==17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontroom_agents"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jsonschema>=4.23",
]
