<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScoreBug</title>
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-text); }
  .stage { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; padding: 32px; }
  .item { display: flex; flex-direction: column; gap: 12px; }
  .label { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  .day { padding: 16px; border-radius: 16px; background: var(--surface-raised); }
  .scale { transform-origin: top left; }
</style>
</head>
<body>
<div id="root" class="stage"></div>
<script>
  const h = React.createElement;
  const F = FrontRoom;
  const item = (label, child, className) => h("div", { className: "item" }, h("p", { className: "label" }, label), className ? h("div", { className }, child) : child);
  ReactDOM.createRoot(document.getElementById("root")).render([
    item("Before the goal", h(F.ScoreBug, { key: 1, home: { short: "KES", colour: "var(--club-kestrel)", ink: "var(--on-club-kestrel)", goals: 0 }, away: { short: "ASH", colour: "var(--club-ashvale)", ink: "var(--on-club-ashvale)", goals: 0 }, clock: "62:54" })),
    item("After it", h(F.ScoreBug, { key: 2, home: { short: "KES", colour: "var(--club-kestrel)", ink: "var(--on-club-kestrel)", goals: 1 }, away: { short: "ASH", colour: "var(--club-ashvale)", ink: "var(--on-club-ashvale)", goals: 0 }, clock: "63:31" })),
  ].map((el, i) => h("div", { key: i }, el)));
</script>
</body>
</html>
