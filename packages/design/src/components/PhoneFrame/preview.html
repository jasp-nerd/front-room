<!-- @dsCard group="Phone" height=480 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhoneFrame</title>
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-text); }
  .stage { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; padding: 32px; }
  .item { display: flex; flex-direction: column; gap: 12px; }
  .label { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  .scale { transform-origin: top left; }
  .half { transform: scale(0.5); transform-origin: top left; width: 207px; height: 434px; }
  .empty { padding: 24px 16px; color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root" class="stage"></div>
<script>
  const h = React.createElement;
  const F = FrontRoom;
  const item = (label, child, className) => h("div", { className: "item" }, h("p", { className: "label" }, label), className ? h("div", { className }, child) : child);
  const screen = (large) => h(F.PhoneFrame, { time: "21:19", lang: "en", large, accent: large ? "pink" : "sky" },
    h(F.LensStrip, { label: "On the TV", onTv: "Where it started", behind: 38, sync: "Synced, 38 s behind live", why: "Why this?" }),
    h("p", { className: "empty" }, large ? "Large type, for fans who asked for it." : "Standard type."));
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { style: { display: "flex", gap: 32 } },
    item("Standard", h("div", { className: "half" }, screen(false))),
    item("Large", h("div", { className: "half" }, screen(true)))
  ));
</script>
</body>
</html>
