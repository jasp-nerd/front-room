<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProvenanceTokens</title>
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-text); }
  .stage { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; padding: 32px; }
  .item { display: flex; flex-direction: column; gap: 12px; }
  .label { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  .day { padding: 16px; border-radius: 16px; background: var(--surface-raised); }
  .scale { transform-origin: top left; }
</style>
</head>
<body>
<div id="root" class="stage"></div>
<script>
  const h = React.createElement;
  const F = FrontRoom;
  const item = (label, child, className) => h("div", { className: "item" }, h("p", { className: "label" }, label), className ? h("div", { className }, child) : child);
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { style: { display: "flex", gap: 48 } },
    item("TV: 3 of 4 asked", h(F.ProvenanceTokens, { asked: 3, inRoom: 4 })),
    item("Phone: 2 of 5 asked", h(F.ProvenanceTokens, { asked: 2, inRoom: 5, size: "phone" }))
  ));
</script>
</body>
</html>
