<!-- @dsCard group="Broadcast" height=420 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LowerThird</title>
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-text); }
  .stage { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; padding: 32px; }
  .item { display: flex; flex-direction: column; gap: 12px; }
  .label { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  .day { padding: 16px; border-radius: 16px; background: var(--surface-raised); }
  .scale { transform-origin: top left; }
  .tv { width: 1120px; transform: scale(0.75); transform-origin: top left; height: 240px; }
</style>
</head>
<body>
<div id="root" class="stage"></div>
<script>
  const h = React.createElement;
  const F = FrontRoom;
  const item = (label, child, className) => h("div", { className: "item" }, h("p", { className: "label" }, label), className ? h("div", { className }, child) : child);
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", null,
    item("With how the room decided (default)", h("div", { className: "tv" }, h(F.LowerThird, { headline: "It started with Mensah's press", line: "He won it back on halfway. Three passes later, Okafor scored.", asked: 3, inRoom: 4, neutral: true }))),
    item("Provenance switched off by the household", h("div", { className: "tv" }, h(F.LowerThird, { headline: "It started with Mensah's press", line: "He won it back on halfway. Three passes later, Okafor scored.", asked: 3, inRoom: 4, neutral: true, showProvenance: false })))
  ));
</script>
</body>
</html>
