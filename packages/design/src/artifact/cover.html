<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Front Room cover</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html, body { margin: 0; background: var(--surface); }
  .cover { display: grid; grid-template-columns: 420px 1fr; width: 960px; height: 288px; overflow: hidden; background: var(--surface); color: var(--ink); }
  .words { display: flex; flex-direction: column; justify-content: space-between; padding: 28px 32px 28px; }
  .lockup { display: flex; align-items: center; gap: 10px; }
  .lockup .head { height: 40px; }
  .lockup .word { height: 24px; }
  .line { margin: 0; font-family: var(--font-display); font-size: 44px; line-height: 44px; font-weight: 800; letter-spacing: -1.5px; text-wrap: balance; }
  .kit { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 24px; height: 24px; border-radius: 999px; }
  .signal { background: var(--signal); }
  .pitch { background: var(--pitch); }
  .sun { background: var(--sun); }
  .sky { background: var(--sky); }
  .pink { background: var(--pink); }
  .navy { background: var(--navy); }
  .gap { width: 10px; }
  .pip { height: 44px; }
  .photo { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
</style>
</head>
<body>
<div class="cover">
  <div class="words">
    <span class="lockup">
      <img class="head" src="/_blob/0b34cf210f1670f91d937244722da0c0" alt="">
      <img class="word" src="/_blob/735b576fb8ca751ae5ccaf0001d43a43" alt="Front Room">
    </span>
    <p class="line">One TV. Everyone's own match.</p>
    <div class="kit" aria-hidden="true">
      <span class="swatch signal"></span>
      <span class="swatch pitch"></span>
      <span class="swatch sun"></span>
      <span class="swatch sky"></span>
      <span class="swatch pink"></span>
      <span class="swatch navy"></span>
      <span class="gap"></span>
      <img class="pip" src="/_blob/45ce4f6cc69751476937a9e17dcd5bf0" alt="">
      <img class="pip" src="/_blob/2c1fe535bd0e97188a4b649537d9886b" alt="">
    </div>
  </div>
  <img class="photo" src="/_blob/1520f6f32ad61ed7fb87d139d569b658" alt="The drawn family on the sofa, with the real TV and their four phones">
</div>
</body>
</html>
